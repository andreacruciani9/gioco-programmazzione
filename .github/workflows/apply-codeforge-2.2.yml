name: Apply CodeForge 2.2
on:
  push:
    paths:
      - 'scripts/apply-codeforge-2.2.py'
      - 'exercises-addon-2.2.json'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply-codeforge-2.2.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js README.md
          git diff --cached --quiet || git commit -m "Aggiorna CodeForge alla 2.2.0"
          git push
