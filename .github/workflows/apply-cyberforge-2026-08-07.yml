name: Apply CyberForge 2026-08-07 update

on:
  push:
    paths:
      - '.github/workflows/apply-cyberforge-2026-08-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python cyberforge/patch-2026-08-07.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyberforge/index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
          else
            git commit -m "Collega nuove missioni CyberForge del 7 agosto"
            git push
          fi
